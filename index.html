<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Rush: Elevator Overload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .hud-top { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: auto; }
        .hud-top h1 { color: #ffd700; font-size: 24px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .stats { display: flex; justify-content: center; gap: 30px; margin-top: 10px; }
        .stat-block { color: #e0e0e0; }
        .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .reputation { color: #ff6b6b; }
        .money { color: #ffd700; }
        .hud-side { position: absolute; top: 0; right: 0; padding: 20px; pointer-events: auto; min-height: 100%; }
        .shop-section { background: rgba(0,0,0,0.8); padding: 15px; margin-bottom: 15px; border-radius: 8px; color: #e0e0e0; }
        .shop-section h3 { margin-bottom: 10px; font-size: 14px; text-transform: uppercase; }
        .upgrade-btn { width: 100%; padding: 10px; margin: 5px 0; background: #1e3a5f; color: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.3s; }
        .upgrade-btn:hover { background: #2d5a8a; }
        .upgrade-btn.disabled { background: #555; cursor: not-allowed; }
        .planet-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; padding: 20px; }
        .planet-btn { padding: 12px; background: #1e3a5f; color: #e0e0e0; border: 2px solid #4a90e2; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; }
        .planet-btn.active { border-color: #ffd700; background: #ffd700; color: #1a1a2e; }
        .floating-text { position: fixed; pointer-events: none; color: #ffd700; font-size: 18px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); pointer-events: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="hud">
        <div class="hud-top">
            <h1>Tower Rush: Elevator Overload</h1>
            <div class="stats">
                <div class="stat-block"><div class="stat-label">Stelle</div><div class="stat-value reputation-value">3</div></div>
                <div class="stat-block"><div class="stat-label">Monete</div><div class="stat-value money-value">0</div></div>
            </div>
        </div>
        <div class="hud-side">
            <div class="shop-section"><h3>Shop - Potenziamenti</h3><button class="upgrade-btn" id="speed-upgrade">Velocità Motore: +2m/s (100€)</button><button class="upgrade-btn disabled" id="capacity-upgrade">Capienza: +1 posto (200€)</button><button class="upgrade-btn disabled" id="doors-upgrade">Porte Rapide (150€)</button></div>
            <div class="shop-section"><h3>Servizi Edificio</h3><button class="upgrade-btn" id="coffee-shop">Caffè Lobby (+15s pazienza)</button><button class="upgrade-btn" id="music-lounge">Musica Lounge (-20% decadimento)</button></div>
            <div class="shop-section"><h3>Ascensori</h3><div class="planet-buttons"><button class="planet-btn active" data-elevator="1">Ascensore 1</button><button class="planet-btn" data-elevator="2">Ascensore 2</button><button class="planet-btn" data-elevator="3">Ascensore 3</button></div></div>
        </div>
    </div>
    <div class="floating-text" id="floating-text"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/controls/OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
